<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alisson Martins — IA Creator</title>
  <meta name="description" content="IA Creator: avatares, lipsync, vozes e cenas com IA para VSLs, leads, upsells e anúncios em cinco idiomas.">
  <meta name="theme-color" content="#05070a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=50">
</head>
<body>

  <div class="grao" aria-hidden="true"></div>

  <header class="topo">
    <a class="marca" href="#quem" data-nav>Alisson Martins</a>
    <nav class="capitulos" aria-label="Capítulos">
      <a href="#quem" data-nav data-cap="quem"><span>A</span><em data-i18n="cap.quem"></em></a>
      <a href="#numeros" data-nav data-cap="numeros"><span>D</span><em data-i18n="cap.numeros"></em></a>
      <a href="#trabalhos" data-nav data-cap="trabalhos"><span>E</span><em data-i18n="cap.trabalhos"></em></a>
      <a href="#produto" data-nav data-cap="produto"><span>F</span><em data-i18n="cap.produto"></em></a>
      <a href="#servicos" data-nav data-cap="servicos"><span>G</span><em data-i18n="cap.servicos"></em></a>
      <a href="#contato" data-nav data-cap="contato"><span>H</span><em data-i18n="cap.contato"></em></a>
    </nav>
    <div class="topo-acoes">
      <button class="idioma" type="button" aria-label="Mudar idioma"><span data-lang="pt">PT</span>/<span data-lang="en">EN</span></button>
      <a class="topo-contato" href="#contato" data-nav data-i18n="nav.contato"></a>
    </div>
  </header>

  <div class="hud hud-esq" aria-hidden="true"><span data-i18n="hud.funcao"></span></div>

  <main>
    <!-- A · Quem cria -->
    <section id="quem" class="cena cena-alta">
      <div class="palco">
        <div class="bloco-texto">
          <h1 class="titulo-display" data-split>Alisson<br>Martins</h1>
          <p class="cargo" data-i18n="a.cargo"></p>
          <p class="lead" data-i18n="a.lead"></p>
          <p class="dica-rolar"><span class="seta"></span><span data-i18n="a.rolar"></span></p>
        </div>
        <figure class="hero-video">
          <div class="hero-quadro">
            <video class="hero-midia" src="media/hanna.mp4" poster="media/hanna-poster.jpg" muted loop playsinline preload="auto"
              aria-label="Vídeo feito com IA: a mesma avatar fala em cinco idiomas"></video>
            <div class="prompt-caixa"><p class="prompt-linha"><span class="digitado">gerar vídeo: Hanna, UGC, 1 avatar → 5 idiomas, voz nativa, 9:16</span><span class="cursor"></span></p>
              <div class="prompt-barra"><span></span></div>
              <div class="prompt-rodape"><p class="prompt-status"></p><button class="botao-gerar" type="button">Gerar</button></div></div>
          </div>
          <button class="botao-som" type="button" data-i18n="c.som"></button>
        </figure>
      </div>
    </section>

    <!-- D · +2000 -->
    <section id="numeros" class="cena cena-muito-alta">
      <div class="palco palco-tunel">
        <div class="tunel" aria-hidden="true"><div class="tunel-mundo"></div></div>
        <div class="numeros">
          <p class="contador">+<span id="contador">0</span></p>
          <p class="contador-rotulo" data-i18n="d.criativos"></p>
          <ul class="stats">
            <li><strong>+2</strong><span data-i18n="d.anos"></span></li>
            <li><strong>5</strong><span data-i18n="d.idiomas"></span></li>
            <li><strong>VSL · UP · LEAD · AD</strong><span data-i18n="d.formatos"></span></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- E · Trabalhos -->
    <section id="trabalhos" class="cena">
      <div class="palco">
        <div class="bloco-texto">
          <h2 class="titulo-display" data-i18n="e.titulo"></h2>
          <p class="lead" data-i18n="e.lead"></p>
          <div class="filtros" role="group" aria-label="Filtros">
            <button type="button" data-filtro="todos" class="ativo" data-i18n="e.f.todos"></button>
            <button type="button" data-filtro="homens" data-i18n="e.f.homens"></button>
            <button type="button" data-filtro="mulheres" data-i18n="e.f.mulheres"></button>
            <button type="button" data-filtro="50+">50+</button>
            <button type="button" data-filtro="3d">3D</button>
            <button type="button" data-filtro="historias" data-i18n="e.f.historias"></button>
          </div>
        </div>
        <div class="celular">
          <div class="celular-tela"><div class="feed-trilho"></div></div>
          <div class="celular-notch"></div>
        </div>
      </div>
    </section>

    <!-- F · Seu produto aqui: pilha de cartas (cada rolagem arremessa a carta de cima) -->
    <section id="produto" class="cena pilha">
      <div class="palco-pilha">
        <div class="cabecalho-secao">
          <h2 class="titulo-display" data-i18n="f.titulo"></h2>
          <p class="lead" data-i18n="f.lead"></p>
          <p class="pilha-contagem"><span id="pilha-atual">01</span> / <span id="pilha-total">00</span></p>
        </div>
        <div class="mesa-cartas">
          <figure class="carta larga"><img loading="lazy" decoding="async" src="media/velaxa/par-dia-noite.jpg" alt="Potes velaxa NIGHT e DAY"><figcaption>VELAXA · DAY / NIGHT</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/hero-flutuando.jpg" alt=""><figcaption>HERO · 01</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/hero-agua-lua.jpg" alt=""><figcaption>HERO · 02</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/linha-gotas.jpg" alt=""><figcaption>GOTAS · 03</figcaption></figure>
          <figure class="carta quadrada"><img loading="lazy" decoding="async" src="media/velaxa/frasco-mao.jpg" alt=""><figcaption>NA MÃO · 04</figcaption></figure>
          <figure class="carta vertical"><img loading="lazy" decoding="async" src="media/velaxa/frasco-mesa.jpg" alt=""><figcaption>EM CASA · 05</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/linha-gummies.jpg" alt=""><figcaption>GOMAS · 06</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/linha-caixa.jpg" alt=""><figcaption>CAIXA · 07</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/linha-creme.jpg" alt=""><figcaption>CREME · 08</figcaption></figure>
          <figure class="carta larga"><img loading="lazy" decoding="async" src="media/velaxa/linha-familia.jpg" alt="Linha completa velaxa NIGHT"><figcaption>LINHA COMPLETA · 09</figcaption></figure>
          <figure class="carta"><img loading="lazy" decoding="async" src="media/velaxa/hero-macro.jpg" alt=""><figcaption>DETALHE · 10</figcaption></figure>
        </div>
      </div>
    </section>

    <!-- G · O que eu faço -->
    <section id="servicos" class="cena cena-livre">
      <div class="cabecalho-secao">
        <h2 class="titulo-display" data-i18n="g.titulo"></h2>
      </div>
      <ol class="servicos"></ol>
    </section>

    <!-- H · Contato -->
    <section id="contato" class="cena cena-livre">
      <div class="contato-palco">
      <div class="contato">
        <figure class="foto-contato">
          <img class="base" loading="lazy" decoding="async" src="media/foto.jpg" alt="Foto de Alisson Martins">
          <figcaption>✓ real_human_detected</figcaption>
        </figure>
        <div class="contato-texto">
        <h2 class="titulo-display" data-i18n="h.titulo"></h2>
        <a class="botao-principal" id="pedir-portfolio" href="#" data-i18n="h.cta"></a>
        <p class="nota" data-i18n="h.nota"></p>
        <ul class="links">
          <li><a id="link-email" href="#"></a></li>
          <li><a id="link-linkedin" href="#">LinkedIn</a></li>
          <li><a id="link-instagram" href="#">Instagram</a></li>
        </ul>
        </div>
      </div>
      </div>
      <footer class="rodape">
        <div class="faixa" aria-hidden="true">
          <div class="faixa-trilho"><span data-i18n="h.faixa"></span><span data-i18n="h.faixa"></span></div>
        </div>
        <div class="rodape-linha">
          <span>© 2026 Alisson Martins · <span data-i18n="h.direitos"></span></span>
          <span class="rodape-status" aria-label="Aberto a novos projetos"><b>[</b> <em id="status-lang">PT</em> <b>]</b> <span id="status-texto">aberto a novos projetos</span></span>
          <span class="rodape-seed"><span data-i18n="h.carregou"></span> <b id="tempo-carga">—</b> · seed 4821</span>
        </div>
      </footer>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" integrity="sha384-wl5TeDVvOWt30Pbf8aSo2ZrzsOjddu3avOBvHe+p+OhJt9gP6w9YXmDkN5DK2/dF" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js" integrity="sha384-QQ7Drnaxr6AM+cySvZNVNIFsvXLGtDLoS5tlUIt2XvIwnqtBtuD7A2KwqlSAWMi1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" integrity="sha384-jqpi9VmOdhyLoLURgjCn7EpnG9BbnHW57ibIZoeaIU+erWDH3k8fQQg0xH2ySjnw" crossorigin="anonymous"></script>
  <script src="js/feed-data.js?v=50"></script>
  <script src="js/wall-data.js?v=50"></script>
  <script type="module" src="js/main.js?v=50"></script>
</body>
</html>
